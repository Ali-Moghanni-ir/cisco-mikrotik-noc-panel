<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narsika - Secure Access</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0B1120; --surface: #1E293B; --border: #334155; --text-main: #F8FAFC; --text-muted: #94A3B8; --primary: #38BDF8; --accent: #818CF8; --danger: #EF4444; --success: #10B981; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-image: radial-gradient(circle at 50% -20%, #1e293b, #0b1120); }
        
        .login-container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 40px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); animation: fadeUp 0.5s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header i { font-size: 40px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        .login-header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .login-header p { color: var(--text-muted); font-size: 14px; margin-top: 8px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); transition: 0.3s; }
        .form-control { width: 100%; padding: 12px 12px 12px 42px; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 8px; color: white; box-sizing: border-box; font-size: 14px; transition: all 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); background: rgba(15, 23, 42, 0.8); }
        .form-control:focus + i, .input-group:focus-within i { color: var(--primary); }
        
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #4f46e5); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.5); }
        
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; font-weight: 500; text-align: center; border: 1px solid transparent; }
        .alert-danger { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: rgba(239, 68, 68, 0.2); }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <i class="fa-solid fa-fingerprint"></i>
        <h1>System Authentication</h1>
        <p>DevOps Operations Center</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <i class="fa-solid {% if category == 'danger' %}fa-shield-virus{% else %}fa-shield-check{% endif %}"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Operator ID</label>
            <div class="input-group">
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="password">Access Token</label>
            <div class="input-group">
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                <i class="fa-solid fa-key"></i>
            </div>
        </div>
        <button type="submit" class="btn-login">Initialize Session <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i></button>
    </form>
</div>

</body>
</html>
